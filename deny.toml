# cargo-deny policy for the dependency tree. `cargo deny check` runs all four sections.

[graph]
all-features = false

[advisories]
ignore = [
    # crypto-bigint 0.5 (timing variability) reaches the tree through the NIST curves p256,
    # p384 and k256 that openmls_rust_crypto compiles for every ciphersuite. unheld's one
    # ciphersuite (config::mls::CIPHERSUITE) is Ed25519 and X25519; no NIST-curve code is
    # called. Lifted the day the provider makes those curves optional or moves to 0.7.
    { id = "RUSTSEC-2026-0387", reason = "p256/p384/k256 are compiled by the MLS provider and never called by unheld's ciphersuite" },
    # A proc macro that runs at build time inside libcrux's hax annotations; no code of it is
    # in the binary.
    { id = "RUSTSEC-2026-0173", reason = "build-time proc macro, not in the binary" },
]

[licenses]
# Everything in the tree is one of these. AGPL-3.0-only is unheld itself.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace crates carry no version.
allow-wildcard-paths = true
# Nothing may bring these in: they would mean a second cryptographic implementation or a
# network stack the crate graph is supposed to be without.
deny = [
    # L2 as a build failure: the crate that holds keys is reachable from the client alone, so
    # the carriers crate, or anything else, that came to depend on it fails here.
    { crate = "unheld-core", wrappers = ["unheld", "unheld-fuzz"], reason = "keys and plaintext stay in core; only the client composes it" },
    { crate = "openssl", reason = "one cryptographic provider, the MLS one" },
    { crate = "ring", reason = "one cryptographic provider, the MLS one" },
    { crate = "reqwest", reason = "no network stack in these crates; the carriers crate alone moves bytes" },
    { crate = "hyper", reason = "no network stack in these crates" },
    { crate = "tokio", reason = "no network stack in these crates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
